{% extends "base.html" %}
{% block title %}Log in — Interceptor{% endblock %}
{% block content %}
<div class="panel" style="max-width: 360px; margin: 3rem auto;">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <p>
            <label>Username</label><br>
            {{ form.username }}
        </p>
        <p>
            <label>Password</label><br>
            {{ form.password }}
        </p>
        <button type="submit">Log in</button>
    </form>
</div>
{% endblock %}
